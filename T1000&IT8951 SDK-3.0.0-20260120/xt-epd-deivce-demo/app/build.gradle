apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'//import kotlin
apply plugin: "kotlin-kapt"

android {
    namespace 'com.xingtai.epd.device.demo'
    compileSdkVersion rootProject.ext.android["compileSdkVersion"]

    defaultConfig {
        applicationId rootProject.ext.android["applicationId"]
        minSdkVersion rootProject.ext.android["minSdkVersion"]
        targetSdkVersion rootProject.ext.android["targetSdkVersion"]
        versionCode rootProject.ext.android["versionCode"]
        versionName rootProject.ext.android["versionName"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true //64K

    }


    buildTypes {

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'


        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    viewBinding {
        enabled = true
    }
}



dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation rootProject.ext.dependencies["appcompat"]
    implementation rootProject.ext.dependencies["constraintLayout"]

    implementation rootProject.ext.dependencies["multidex"]
    implementation rootProject.ext.dependencies["kotlin"]
    implementation rootProject.ext.dependencies["gson"]
    implementation rootProject.ext.dependencies["eventbus"]
    implementation rootProject.ext.dependencies["mmkv"]
    implementation rootProject.ext.dependencies["autosize"]
    //file downloader
    implementation rootProject.ext.dependencies["filedownloader"]

    implementation 'com.github.kellysong:common-utils:1.2.0'
    implementation 'com.guolindev.permissionx:permissionx:1.6.3'
    implementation project(':mqtt')
    implementation project(':sys-api')
    implementation project(':smt40a-sys-api')

}

